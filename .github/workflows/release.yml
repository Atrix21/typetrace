name: release
# Runs when a GitHub release is published, or by hand for an existing tag.
#  - npm: publishes typetrace-cli to npmjs.com with provenance, through npm trusted publishing (OIDC, no stored
#    token). Skipped when that version is already on npm.
#  - github-packages: publishes the same package to GitHub Packages as @atrix21/typetrace-cli, so it is listed on the
#    repository page. Skipped when that version is already there.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.2.0
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - name: tag matches package version; skip if already published
        id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$TAG" ]; then echo "tag $TAG does not match package version $v"; exit 1; fi
          if npm view "typetrace-cli@$v" version >/dev/null 2>&1; then echo "typetrace-cli@$v is already on npm"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: npm ci --ignore-scripts
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public

  github-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@atrix21'
      - name: tag matches package version; skip if already published
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$TAG" ]; then echo "tag $TAG does not match package version $v"; exit 1; fi
          if npm view "@atrix21/typetrace-cli@$v" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then echo "already on GitHub Packages"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: npm ci --ignore-scripts
      - if: steps.check.outputs.skip != 'true'
        name: publish as @atrix21/typetrace-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name=@atrix21/typetrace-cli
          npm publish
