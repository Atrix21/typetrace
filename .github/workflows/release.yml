name: release
# Runs when a GitHub release is published, or by hand for an existing tag.
#  - npm: publishes typetrace-cli to npmjs.com with provenance, through npm trusted publishing (OIDC, no stored
#    token). Skipped when that version is already on npm.
#  - mcp-registry: lists the new version in the official MCP Registry (io.github.atrix21/typetrace).
#  - github-packages: publishes the same package to GitHub Packages as @atrix21/typetrace-cli, so it is listed on the
#    repository page. Skipped when that version is already there.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.2.0
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - name: tag matches package version; skip if already published
        id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$TAG" ]; then echo "tag $TAG does not match package version $v"; exit 1; fi
          if npm view "typetrace-cli@$v" version >/dev/null 2>&1; then echo "typetrace-cli@$v is already on npm"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: npm ci --ignore-scripts
      - if: steps.check.outputs.skip != 'true'
        id: publish
        run: npm publish --provenance --access public

  mcp-registry:
    # The official MCP Registry lists the version just published to npm (it checks mcpName in package.json).
    needs: npm
    if: needs.npm.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: server.json version = package version
        run: |
          v=$(node -p "require('./package.json').version")
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@atrix21'
      - name: tag matches package version; skip if already published
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$TAG" ]; then echo "tag $TAG does not match package version $v"; exit 1; fi
          if npm view "@atrix21/typetrace-cli@$v" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then echo "already on GitHub Packages"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: npm ci --ignore-scripts
      - if: steps.check.outputs.skip != 'true'
        name: publish as @atrix21/typetrace-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name=@atrix21/typetrace-cli
          npm publish
